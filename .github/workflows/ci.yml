name: CI

# Runs on this repo's own self-hosted runner (sxi-work, label `knitknot`).
# GitHub-hosted minutes are a capped shared budget and this repo is the
# heavy one (52 MB STIX fixture in the test tree), so it runs where the
# fixture already lives.
#
# A self-hosted job queues while that machine is offline — it does not
# fall back to hosted. See GOVERNANCE.md "CI".
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, linux, knitknot]
    steps:
      - uses: actions/checkout@v4
      # setup-go downloads a toolchain (1.25.1 here) and caches it; the
      # sxi-work runner already has Go 1.27.4 on PATH, so use that and
      # skip the ~1.7 GB cache upload this job was spending 6 MB/s on.
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...